name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify tag matches Cargo.toml version
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag }}"
          else
            tag_name="${GITHUB_REF_NAME}"
          fi
          if [ "${tag_name#v}" != "$cargo_version" ]; then
            echo "::error::tag $tag_name does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_ENV"
          echo "tag_name=$tag_name" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        env:
          # ureq's TLS stack pulls `ring`, which compiles C + asm; point its
          # build at the musl cross compiler from musl-tools.
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Package
        run: |
          dist="ai-vedit-${version}-${TARGET}"
          mkdir "$dist"
          cp "target/${TARGET}/release/ai-vedit" "$dist/"
          cp README.md LICENSE "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          files: |
            ai-vedit-${{ env.version }}-x86_64-unknown-linux-musl.tar.gz
            ai-vedit-${{ env.version }}-x86_64-unknown-linux-musl.tar.gz.sha256
          generate_release_notes: true
